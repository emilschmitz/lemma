# Opus 5.5, no verified examples, data profile on: the 14 queries of the frozen set not run in opus_none_stats.toml.
# Run: uv run python research_loop/scripts/container_batch.py --experiment configs/experiments/opus_none_stats_rest.toml
[settings]
examples = "none"
data_profile = "stats"

