[settings]
assumptions = false
examples = "principles"
data_profile = "stats"
templates = true
stream = true
pushdown = false
agent_scan = false

[[run]]
model = "claude-opus-5-5"
query = "configs/query_templates/tpch/q03.sql"
duckdb_path = "research_loop/generated/tpch_sf10.duckdb"
bindings_rules = "configs/query_templates/tpch/substitution.json"
bindings_seed = 1

