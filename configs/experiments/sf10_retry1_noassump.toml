# Retry family of sf10_batch_noassump.toml (SHA 5c8537c, 2026-10-19): only the six queries that failed on host software, same SQL and settings.
# retry_of = "sf10_batch_noassump" from_sha = "5c8537c" to_sha = this commit. Fixes (each with tests):
#   tpch Q9, SEC q4: step 7, the host measure re-checked the leftover file instead of the marked submit (9ef668e)
#   tpch Q14: step 1, data profile refused division (9d3e53a); SEC q2: step 1, data profile on a join to a derived table (dc867a1)
#   SEC q6: step 5, host lemma_scan_rows_<t> failed on a nullable scan column (12306cd); SEC q3: step 2, HAVING SUM > AVG(..) needs exact division (merged)
# Run: uv run python research_loop/scripts/container_batch.py --experiment configs/experiments/sf10_retry1_noassump.toml
[settings]
assumptions = false
examples = "none"
data_profile = "stats"
templates = true

