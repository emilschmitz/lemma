# Run (from main after the merge, clean tree, pinned SHA):
#   uv run python research_loop/scripts/container_batch.py --experiment configs/experiments/stream_templates_sec_opus.toml
[settings]
assumptions = false
examples = "principles"
data_profile = "stats"
templates = true
stream = true
pushdown = false
agent_scan = false

[[run]]
model = "claude-opus-5-5"
query = "configs/query_templates/sec_edgar/q6.sql"
duckdb_path = "holdout/gendb_sec_edgar/duckdb/sec_edgar_dec.duckdb"
bindings_rules = "configs/query_templates/sec_edgar/bindings.json"
bindings_seed = 1

[[run]]
model = "claude-opus-5-5"
query = "configs/query_templates/sec_edgar/q4.sql"
duckdb_path = "holdout/gendb_sec_edgar/duckdb/sec_edgar_dec.duckdb"
bindings_rules = "configs/query_templates/sec_edgar/bindings.json"
bindings_seed = 1
