# lemma.toml -- the ONE place for every setting that shapes a container run, and for the safety/infrastructure settings around it.
#
# Precedence (one rule, no other source):   lemma.toml  <  environment variable  <  explicit CLI flag
#   * The environment variable of a key is LEMMA_ + the key upper-cased, whatever the section:
#       [measure] official_rounds  ->  LEMMA_OFFICIAL_ROUNDS=7
#     An empty variable counts as unset.
#   * CLI flags exist where a launcher has one (--max-iterations, --agent, --menu, ...); they win over everything.
#   * Unknown keys here, unknown LEMMA_* variables in the environment, and bad values fail loudly at startup
#     (python -m lemma_config check). Old spellings (AGENT_TIMEOUT_SEC, VERUS_MEM_MAX, ...) still work for now with a
#     deprecation message; dead settings are rejected. The alias and dead tables are in lemma_config.py.
#   * Every container run writes every key below with its value and source (file/env/cli) into the run manifest and the
#     RESULT line, together with the git SHA and git_dirty. A dirty tree (tracked files) is refused unless allow_dirty = true.
#   * Shell scripts read a value with:  python3 -m lemma_config get <key>   (scripts/ram/*.sh do; they need no other default).
#
# Defaults are what a container run uses today. Conflicts between the old sources were resolved to the value the frozen
# container run used (marked "decision" below); docs/FLAGS.md has the inventory and the old values.
#
# NOT here, because they are fixed by the container launcher rather than chosen: USE_AGENT_DOCKER=1, LEMMA_AGENT_BACKEND=cli,
# the agent image and command, the agent container limits (--memory 3g --network none --cap-drop ALL), scope swap 0, oom score 800,
# the Verus guard slot lock. Secrets (ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN) are never config: environment only.

# ======================================================================================================================
# DATA ASSUMPTIONS ARE OFF BY DEFAULT (owner decision, 2026-10-17). The assumption-package path (assumptions = true:
# row caps, value caps, dictionary-size caps, unique keys and join caps in valid_cols, asserted by the generated main)
# is UNMAINTAINED. The default follows JetStream (arXiv 2610.20527): the spec uses exact mathematical integers, valid_cols
# states only what the fixed loader builds and checks (column lengths, dictionary codes in range, distinct dictionary
# entries), and run_query returns Option: None = DECLINE (e.g. a checked addition overflowed). A declined run is labelled
# DECLINED, is neither a success nor a proof failure, and counts as a FAILED query in experiments. See docs/FLAGS.md.
# ======================================================================================================================
[run]
spec_style = "declarative"                  # declarative | imperative: the whole chain (emitter, assembler, admission, prompt, measure)
menu = "adversary_declarative0"             # menu profile (research_loop/menu_profile.py); its axes are the next five keys
agent_model = "claude-sonnet-5-5"           # prover model slug; claude-* runs Claude Code in the container. Decision: the frozen run's model (the menu profile said haiku)
trusted_set = "declarative_default"         # host lemma block pasted into the spec
assumptions = false                         # false (default since 2026-10-17): no data assumptions, run_query may decline (None), see the block above. true = the UNMAINTAINED assumption-package path (byte-identical to before the flag; needs assumption_package)
assumption_package = ""                     # only with assumptions = true (UNMAINTAINED), then REQUIRED (empty fails loudly): a package name, a .json path, or the explicit value "auto" = the package that matches the DuckDB file (sec_margin_dec for DECIMAL). With assumptions = false it must stay empty
speed_bar_mult = 1.0                        # verdict: median(ours) * mult < median(DuckDB)
max_iterations = 2                          # agent sessions per query before any early-ending continuation: the per-query wall budget is max_iterations x agent_timeout_sec. A further session starts from the best body so far. Decision: 2 (the frozen run; the loop default 3 and MAX_ITERATIONS=1/4 are legacy)
string_encoding = "dict"                    # plain | dict: dictionary-encoded string columns (the frozen run's setting)
join_chain = true                           # fact table first, unique-key tables nested after it. A query whose tables lack unique keys in the assumption package keeps the general (non-chain) form; false forces the general form always
examples = "full"                           # full | principles | none: which verified examples the agent sees
narrow_cells = false                        # INTEGER/SMALLINT/TINYINT and capped DECIMAL columns loaded as i32/i16/i8
parallel_vstd = "auto"                      # off | auto | on. Decision: explicit "auto" (the frozen run's effective value; it used to be forced silently and the shell value was overwritten). on = every spec gets Arc params, a shape without a variant fails at emit
stateful = false                            # true: the contract is an agent-written state QState with build(cols) and execute(&QState, params), both proved against the same query spec; the fixed host runtime rebuilds the state lazily when the caller's data version changes (declarative_spec/stateful.py, docs/STATEFUL.md). The parallel (Arc) variant is not emitted then. false = run_query, byte-identical specs

[agent]
speed_target = 10.0                         # float >= 1.0: speedup over the reference engine the agent is told to aim for after its first body beats the bar (prompt, section "Target speedup"). Within the per-query budget (max_iterations x agent_timeout_sec) a session that ends early below this target is followed by another one from the best submitted body. 1.0 = the old behaviour (a further session only after one that did not verify)
max_idle_sessions = 2                       # int >= 1: stop starting further sessions after this many consecutive sessions without a better submitted speedup
agent_timeout_sec = 1800                    # wall seconds per agent session. Decision: 1800 (2 x 1800 s = 60 min per query with max_iterations = 2; was 900, 750, earlier 600)
max_budget_usd = 20.0                       # float >= 0: model spend cap PER QUERY across all its agent sessions (Claude only). Each session gets `--max-budget-usd <remaining>`; remaining = this minus the spend of the earlier sessions (total_cost_usd of the stream-json result event). No further session once it is used up. 0 = no cap
agent_submit_ends_session = false           # true: a successful submit_runquery ends the session
agent_data_mode = "none"                    # none | stats | full: interactive DuckDB tool for the agent. Decision: none (what config.env gave the frozen run; code default stats; the CLI container is network-none anyway)
agent_resource_exhausted_retries = 8        # Cursor agent only: retries on API quota errors
agent_auth = "login"                        # login | api_key: how the Claude agent container authenticates. login = the host Claude Code login (read-only mount; ANTHROPIC_API_KEY is ignored and never passed). api_key = ANTHROPIC_API_KEY from the environment, passed into the container by NAME only (never written to disk, a manifest or a log). An explicit choice, never a fallback: api_key without the variable set fails loudly
claude_effort = "none"                      # none | low | medium | high | xhigh | max: Claude Code --effort (none omits the flag)
claude_thinking_tokens = ""                 # MAX_THINKING_TOKENS of the Claude agent; empty = CLI default
claude_tool_search = ""                     # ENABLE_TOOL_SEARCH of the Claude agent: true | false | auto | auto:N; empty = CLI default
mcp_iterate_rows = 50000                    # row cap named in the prompt and checked at submit (probe pins); 0 = uncapped. The declarative measure itself always times the full tables

[prover]
verus_rlimit = 16.0                         # Verus --rlimit (Z3 work per function/loop)
verus_timeout_sec = 300                     # wall limit of verify + optimized build. Decision: the ONE Verus timeout knob (VERUS_VERIFY_TIMEOUT_SEC 120 is now its alias; the MCP harness wait is derived from it)
run_timeout_sec = 60                        # wall limit of one compiled-binary run (load, warm-up, timed runs)
target_cpu = "x86-64-v3"                    # rustc -C target-cpu of the compiled binary (generic = no flag; native can SIGILL elsewhere)
dense_slot_budget = 4194304                 # largest dense slot table (product of key dictionary sizes) a body may allocate

[measure]
official_rounds = 5                         # interleaved rounds (ours vs DuckDB) of the official verdict
official_duck_reps = 9                      # DuckDB executions per round (median); our side is the binary's own 9 timed runs
duck_memory_limit = "8GB"                   # DuckDB PRAGMA memory_limit on every measure connection. Decision: 8GB (frozen run); must stay below safety.scope_memory_max (checked)
duck_threads = 8                            # DuckDB PRAGMA threads on the same connections

[data]
duckdb_path = ""                            # REQUIRED, no default (empty fails loudly): the database (schema, catalog, reference timing, row counts); relative to the repo root or absolute. Set it in this file, with LEMMA_DUCKDB_PATH, or with a launcher flag
data_profile = "none"                       # none | stats: stats = exact data statistics of this query (selectivities, distinct counts, join and group sizes, ties at the LIMIT; SQL on the database, no LLM) in context/ro/data_profile.md

[safety]
allow_dirty = false                         # true: let a container run start from a dirty git tree (tracked files). Paper runs: never
scope_memory_max = "9G"                     # MemoryMax of the systemd scope around one container run. Equal to the lemma.slice cap (9G): a larger value would be capped by the slice anyway
egress_profile = ""                         # API hosts the agent container may reach: cursor | anthropic | openai | openrouter | google (comma list); empty = inferred from the agent command
egress_allowlist = ""                       # comma list of host suffixes replacing the profile; empty = profile
heavy_lock = "/tmp/lemma_timing.lock"       # machine-wide lock: data export and timed run take it exclusively, Verus shared
heavy_min_avail_mb = 4000                   # wait until MemAvailable is at least this before a heavy phase or a heavy.sh job. Decision: 4000 (heavy_phase.py said 3500, heavy.sh 4000)
heavy_mem_max = "5G"                        # scope MemoryMax of scripts/ram/heavy.sh jobs
verus_mem_max = "6G"                        # MemoryMax of each Verus run
verus_slots = 1                             # concurrent Verus runs machine-wide
verus_min_avail_mb = 3000                   # do not start Verus below this MemAvailable

[sql]
# New SQL shapes of the declarative transpiler. Each key gates ONE capability; false = the emitter refuses the shape exactly as before (byte-identical specs for everything else). docs/FLAGS.md and research_loop/menus/sql_<feature>_ADVERSARY_VERDICT.md say what each one states and checks.
agg_times_constant = false                  # SUM(x)*K, SUM(x)/c, c*AVG(x), HAVING with a scaled aggregate side (TPC-H Q11/Q17/Q20 shapes)
derived_agg_expr = false                    # CASE aggregate (and ratio of CASE aggregates) over a plain SPJ derived table, extract(year) keys (TPC-H Q8 shape)
cte_reuse = false                           # a WITH name used at several places (FROM, JOIN, scalar subquery), grouped WITH joined to a unique-key table, MAX/MIN over derived groups, GROUP BY a select alias (TPC-H Q15 shape)
left_join_count = false                     # LEFT JOIN with right-table ON conjuncts, COUNT over the right side, count of counts (TPC-H Q13 shape)
templates = false                           # query templates: a `-- params: name TYPE, ...` header and `$name` placeholders; each parameter is an argument of the spec and of run_query (one proof for every value), the official measure binds fresh values per round (declarative_spec/templates.py)

[engine]
# Lemma inside DuckDB (db_extension/duckdb_ext/README.md). Default off; nothing here is used by a container run.
in_duckdb = false                           # true: the assembler may emit library mode (the proved run_query as a cdylib with the fixed C entry point lemma_run) and research_loop/in_duckdb.py may install executors into ${LEMMA_HOME}/executors for the DuckDB extension. Off: library mode is refused and nothing is installed

[wip]
# Parked work, integrated for reference and switched off. Nothing here is used by a container run. Each key points at the document that says why it is parked.
zero_copy = false                           # WIP/parked: read DuckDB's pinned chunks in place (trusted ZC-1), shelved 2026-10-07, see research_loop/menus/pin_path_archive.md
cold_stream = false                         # WIP/parked: run the proved fold as a DuckDB C-API aggregate/scalar (trusted ZC-2/ZC-2s), shelved 2026-10-07, see research_loop/menus/pin_path_archive.md
cold_stream_mode = "aggregate"              # WIP/parked: aggregate | scalar, used only with cold_stream; scalar is not switch-on ready, see research_loop/menus/pin_path_archive.md
