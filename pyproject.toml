[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lemma"
version = "0.1.0"
description = "Lemma — verified query synthesis (Verus proofs + native Rust + DuckDB extension)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sql-transpiler",
    "verus-transpiler",
    "pytest>=9.1.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-rust>=0.24.2",
    "openai>=2.45.0",
    "mcp>=1.28.1",
    "duckdb==1.5.6",
    "numpy>=2.4.6",
]

[project.scripts]
lemma = "lemma_cli.main:main"

[tool.setuptools]
packages = ["lemma_cli"]

[tool.pytest.ini_options]
markers = ["slow: real Docker integration tests (opt in with -m slow)"]
addopts = "-m 'not slow'"

[tool.uv.workspace]
members = ["db_extension/dafny_transpiler", "verus_transpiler"]

[tool.uv.sources]
sql-transpiler = { workspace = true }
verus-transpiler = { workspace = true }

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.4",
    "seaborn>=0.13.2",
]
